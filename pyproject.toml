[project]
name = "fairybrowser"
version = "0.1.0"
description = "Fairies are whispering..."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "psutil",
    "playwright",
    "pywin32",
    "Pillow",
    "pyautogui",
    "pynput",
    "selenium",
    "selectolax",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=7.0.0", "ruff>=0.15", "ty", "mypy>=1.14.1", "prek"]


# pyproject.toml
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --show-capture=no"
testpaths = ["tests"]


[tool.ruff]
fix = true
line-length = 120

[tool.ruff.lint]

select = ["E", "F", "I"]
ignore = [
    "E501", # Exclude specific rule: Line too long
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]


[tool.ty.rules]
unused-ignore-comment = "ignore"

[tool.uv]
exclude-newer = "1 week"
